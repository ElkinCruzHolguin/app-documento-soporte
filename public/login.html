<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="app.css">
<style>
  .login { max-width: 360px; margin: 12vh auto 0; }
  body { background: var(--side); }
  .login { padding: 28px; box-shadow: 0 20px 50px oklch(0 0 0 / 30%); }
  .login h1 { font: 600 20px/1.25 var(--font-display); margin: 0 0 6px; display: flex; align-items: center; gap: 12px; }
  .login form > div { margin-top: 12px; }
  .login button { width: 100%; margin-top: 16px; padding: 9px; }
  .login .alterno { margin-top: 16px; text-align: center; font-size: 13px; }
  #codigo { font-size: 22px; letter-spacing: 8px; text-align: center; }
  .recordar { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 13px; margin: 4px 0 12px; cursor: pointer; }
  .recordar input { width: auto; margin: 0; }
</style>
</head>
<body>
<main>
  <section class="panel login">
    <h1>Documentos soporte · Saphety</h1>
    <p class="ayuda" id="ayuda">Ingresa con tu usuario (correo) y contraseña.</p>
    <div id="msg"></div>

    <!-- Paso 1: usuario y contraseña -->
    <form id="form">
      <div><label for="usuario">Usuario (correo)</label><input id="usuario" name="usuario" autocomplete="username" required autofocus></div>
      <div><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password" required></div>
      <button type="submit" id="btn">Continuar</button>
    </form>

    <!-- Paso 2: código de un solo uso enviado al correo -->
    <form id="formCodigo" hidden>
      <div><label for="codigo">Código de 6 dígitos</label><input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div>
      <label class="recordar"><input type="checkbox" id="recordar" checked> No pedir el código en este navegador durante 7 días</label>
      <button type="submit" id="btnCodigo">Ingresar</button>
      <p class="alterno"><a href="#" id="btnReenviar">Reenviar código</a> · <a href="#" id="btnVolver">Volver</a></p>
    </form>
  </section>
</main>
<script>
// Al llegar a esta pantalla se olvida el menú guardado de la sesión anterior (ver comun.js).
try { sessionStorage.removeItem('ds_menu'); } catch { /* sin almacenamiento */ }
const $ = (id) => document.getElementById(id);
const form = $('form');
const formCodigo = $('formCodigo');
const msg = $('msg');
const aviso = (texto, tipo) => { msg.innerHTML = texto ? `<div class="aviso ${tipo}"></div>` : ''; if (texto) msg.firstChild.textContent = texto; };

async function post(ruta, cuerpo) {
  const r = await fetch(ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}
async function ocupado(boton, fn) {
  boton.disabled = true;
  aviso('');
  try { await fn(); } catch (e) { aviso(e.message, 'err'); } finally { boton.disabled = false; }
}
function paso(n, destino) {
  form.hidden = n !== 1;
  formCodigo.hidden = n !== 2;
  $('ayuda').textContent = n === 1
    ? 'Ingresa con tu usuario (correo) y contraseña.'
    : `Te enviamos un código a ${destino}. Escríbelo para terminar de entrar; vence en 10 minutos. Revisa también la carpeta de spam.`;
  (n === 1 ? form.clave : formCodigo.codigo).focus();
}

form.onsubmit = (ev) => {
  ev.preventDefault();
  ocupado($('btn'), async () => {
    try {
      const d = await post('/api/login', { usuario: form.usuario.value, clave: form.clave.value });
      if (d.paso === 'codigo') return paso(2, d.destino);
      // Se entra por el Dashboard; si el usuario no lo tiene, comun.js lo lleva a su primer módulo visible.
      location.href = 'dashboard.html';
    } finally {
      form.clave.value = '';
    }
  });
};
formCodigo.onsubmit = (ev) => {
  ev.preventDefault();
  ocupado($('btnCodigo'), async () => {
    try {
      await post('/api/login/verificar', { codigo: formCodigo.codigo.value, recordar: $('recordar').checked });
      location.href = 'dashboard.html';
    } catch (e) {
      formCodigo.codigo.value = '';
      formCodigo.codigo.focus();
      throw e;
    }
  });
};
$('btnReenviar').onclick = (ev) => {
  ev.preventDefault();
  ocupado($('btnCodigo'), async () => {
    const d = await post('/api/login/reenviar');
    aviso(`Te enviamos un código nuevo a ${d.destino}.`, 'ok');
  });
};
$('btnVolver').onclick = (ev) => { ev.preventDefault(); formCodigo.codigo.value = ''; aviso(''); paso(1); };
</script>
</body>
</html>
