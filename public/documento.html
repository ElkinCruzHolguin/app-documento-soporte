<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento</title>
<link rel="stylesheet" href="app.css">
<script src="comun.js"></script>
</head>
<body>
<header>
  <h1>Documentos soporte · Saphety</h1>
  <nav><a href="index.html">Cargar y enviar</a><a href="emitidos.html" class="activo">Emitidos</a><a href="historial.html">Historial</a><a href="admin.html" data-enlace-admin>Administración</a></nav>
  <div id="banner"></div>
</header>
<main>
  <div class="encabezado">
    <div>
      <p class="antetitulo"><a class="enlace-doc" href="emitidos.html">← Emitidos</a> · <span id="tipo"></span></p>
      <h1 id="titulo">Documento</h1>
      <p class="ayuda" id="subtitulo"></p>
    </div>
    <div class="fila-botones" style="margin:0" id="acciones"></div>
  </div>
  <div id="msg"></div>

  <div class="detalle oculto" id="detalle">
    <section class="panel" style="padding:12px">
      <iframe class="visor" id="visor" title="Representación gráfica del documento"></iframe>
      <p class="ayuda" id="sinPdf"></p>
    </section>
    <div>
      <section class="panel"><h2>Resumen</h2><dl class="datos" id="resumen"></dl></section>
      <section class="panel"><h2>Ítems</h2><div id="lineas"></div></section>
      <section class="panel"><h2>Respuestas de la DIAN</h2><div id="respuestas"></div></section>
    </div>
  </div>
</main>

<script>
const fecha = (iso) => (iso ? new Date(iso).toLocaleString('es-CO', { timeZone: 'America/Bogota', dateStyle: 'medium', timeStyle: 'short' }) : '—');
const id = new URLSearchParams(location.search).get('id') || '';
const urlArchivo = (formato, descargar) => `/api/emitidos/${encodeURIComponent(id)}/${formato}${descargar ? '?descargar=1' : ''}`;
const dato = (etiqueta, valor) => `<dt>${esc(etiqueta)}</dt><dd>${valor || '—'}</dd>`;

function tabla(columnas, filas) {
  return `<div class="tabla-scroll"><table><thead><tr>${columnas.map((c) => `<th${c.num ? ' class="num"' : ''}>${esc(c.t)}</th>`).join('')}</tr></thead>
    <tbody>${filas.map((f) => `<tr>${columnas.map((c) => `<td${c.num ? ' class="num"' : ''}>${f[c.k] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/** Las respuestas llegan como objetos de Saphety: se muestran sus campos simples en una tabla. */
function tablaRespuestas(respuestas) {
  if (!respuestas.length) return '<p class="ayuda">Sin respuestas registradas.</p>';
  if (respuestas.some((r) => !r || typeof r !== 'object')) return `<pre>${esc(JSON.stringify(respuestas, null, 2))}</pre>`;
  const claves = [...new Set(respuestas.flatMap((r) => Object.keys(r).filter((k) => r[k] == null || typeof r[k] !== 'object')))].slice(0, 6);
  const valor = (v) => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v) ? fecha(v) : v);
  return tabla(claves.map((k) => ({ t: k, k })), respuestas.map((r) => Object.fromEntries(claves.map((k) => [k, esc(valor(r[k]))]))));
}

async function cargar() {
  const msg = document.getElementById('msg');
  msg.innerHTML = '<div class="aviso warn">Consultando Saphety…</div>';
  try {
    const { documento: d, validaciones, respuestas, lineas, avisos } = await api(`/api/emitidos/${encodeURIComponent(id)}`);
    document.title = d.numero || 'Documento';
    document.getElementById('tipo').textContent = d.tipo;
    document.getElementById('titulo').textContent = d.numero;
    document.getElementById('subtitulo').innerHTML = `${chip(d.estado)} <span class="codigo">${esc(d.estadoSaphety)}</span> · ${esc(d.proveedor)}`;
    document.getElementById('acciones').innerHTML = `
      <button class="secundario" id="btnCopiar" ${d.cuds ? '' : 'disabled'}>Copiar CUDS</button>
      <a class="boton secundario" href="${urlArchivo('xml', true)}">XML</a>
      <a class="boton secundario" href="${urlArchivo('attached', true)}">AttachedDocument</a>
      <a class="boton" href="${urlArchivo('pdf', true)}">Descargar PDF</a>`;
    document.getElementById('btnCopiar').onclick = async () => {
      await navigator.clipboard.writeText(d.cuds);
      document.getElementById('btnCopiar').textContent = 'CUDS copiado';
    };

    document.getElementById('resumen').innerHTML = [
      dato('Estado DIAN', `${chip(d.estado)} <span class="codigo">${esc(d.estadoSaphety)}</span>`),
      dato('Fecha de estado', esc(fecha(d.estadoFecha))),
      d.motivo ? dato('Motivo', esc(d.motivo)) : '',
      dato('Proveedor', `${esc(d.proveedor)}<div class="codigo">${esc(d.proveedorCodigo)}</div>`),
      dato('Adquiriente', `${esc(d.compania)}<div class="codigo">${esc(d.companiaCodigo)}</div>`),
      dato('Fecha del documento', esc(fecha(d.fechaDocumento))),
      dato('Creado en Saphety', esc(fecha(d.fechaCreacion))),
      dato('Valor total', `${esc(d.moneda)} ${pesos(d.valor)}`),
      dato('Correo', d.correo ? `${esc(d.correo)} <span class="codigo">${esc(d.correoEstado)}</span>` : ''),
      dato('CUDS', d.cuds ? `<span class="codigo">${esc(d.cuds)}</span>` : ''),
      dato('Id Saphety', `<span class="codigo">${esc(d.id)}</span>`),
    ].join('');

    document.getElementById('lineas').innerHTML = lineas.length
      ? tabla([{ t: '#', k: 'numero' }, { t: 'Descripción', k: 'descripcion' }, { t: 'Valor', k: 'valorTxt', num: true }, { t: 'IVA', k: 'ivaTxt', num: true }],
        lineas.map((l) => ({ numero: esc(l.numero), descripcion: esc(l.descripcion), valorTxt: pesos(l.valor), ivaTxt: l.iva ? pesos(l.iva) : '' })))
      : '<p class="ayuda">Saphety no entregó las líneas de este documento.</p>';

    const validacionesHtml = validaciones.length
      ? `<h3>Errores de validación</h3><ul class="lista-msg err">${validaciones.map((v) => `<li>${esc(typeof v === 'string' ? v : [v.Code, v.Description || v.Message].filter(Boolean).join(': ') || JSON.stringify(v))}</li>`).join('')}</ul>` : '';
    document.getElementById('respuestas').innerHTML = tablaRespuestas(respuestas) + validacionesHtml;

    const visor = document.getElementById('visor');
    if (d.pdfGenerado) visor.src = urlArchivo('pdf');
    else { visor.classList.add('oculto'); document.getElementById('sinPdf').textContent = 'Saphety aún no generó el PDF de este documento.'; }

    msg.innerHTML = avisos.map((a) => `<div class="aviso warn">${esc(a)}</div>`).join('');
    document.getElementById('detalle').classList.remove('oculto');
  } catch (e) {
    msg.innerHTML = `<div class="aviso err">${esc(e.message)}</div>`;
  }
}
cargar();
</script>
</body>
</html>
